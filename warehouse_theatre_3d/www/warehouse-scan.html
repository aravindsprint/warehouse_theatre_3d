<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#2563eb"/>

  <meta name="apple-mobile-web-app-capable" content="yes"/>

{%- endraw %}
  <script>window.csrf_token = "{{ csrf_token }}";</script>
{%- raw %}

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/assets/warehouse_theatre_3d/sw.js', {scope:'/'})
        .catch(e => console.warn('SW:', e));
    }
  </script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/assets/warehouse_theatre_3d/js/scan/wt-scan.js?v=1"></script>

    if (window.WarehouseScan) window.WarehouseScan.mount('#wt-scan-root');
  </script>
</body>
</html>
