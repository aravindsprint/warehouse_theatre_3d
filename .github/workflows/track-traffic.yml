name: Track Repo Traffic

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record-traffic:
    runs-on: ubuntu-latest
    steps:
      # Data lives on its own branch so these daily commits don't land on main,
      # where every commit shows up as a draft release on Frappe Cloud.
      - name: Checkout traffic-data branch
        uses: actions/checkout@v4
        with:
          ref: traffic-data

      - name: Fetch and append clone/view traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p traffic-data

          CLONES_FILE="traffic-data/clones-history.csv"
          VIEWS_FILE="traffic-data/views-history.csv"

          [ -f "$CLONES_FILE" ] || echo "date,count,uniques" > "$CLONES_FILE"
          [ -f "$VIEWS_FILE" ] || echo "date,count,uniques" > "$VIEWS_FILE"

          CLONES_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/clones")

          echo "$CLONES_JSON" | jq -r '.clones[] | "\(.timestamp | split("T")[0]),\(.count),\(.uniques)"' \
            >> "$CLONES_FILE.tmp"

          VIEWS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views")

          echo "$VIEWS_JSON" | jq -r '.views[] | "\(.timestamp | split("T")[0]),\(.count),\(.uniques)"' \
            >> "$VIEWS_FILE.tmp"

          for pair in "$CLONES_FILE" "$VIEWS_FILE"; do
            tail -n +2 "$pair" > "$pair.body" 2>/dev/null || touch "$pair.body"
            # Fresh rows first + stable sort: a day fetched again (e.g. yesterday's
            # partial count, now complete) keeps the newest value.
            cat "$pair.tmp" "$pair.body" | sort -s -t, -k1,1 -u > "$pair.merged"
            { echo "date,count,uniques"; sort -t, -k1,1 "$pair.merged"; } > "$pair"
            rm -f "$pair.tmp" "$pair.body" "$pair.merged"
          done

      - name: Commit updated traffic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic-data/
          git diff --cached --quiet || git commit -m "chore: update traffic history $(date -u +%Y-%m-%d)"
          git push origin HEAD:traffic-data
